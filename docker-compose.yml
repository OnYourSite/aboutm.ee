services:
  web:
    build: .
    image: aboutm-ee:latest
    container_name: aboutm-ee
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL fehlt}
    volumes:
      - caddy_data:/data      # Zertifikate (unbedingt behalten!)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
